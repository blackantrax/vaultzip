[package]
name = "vaultzip-gui"
description = "VaultZip desktop application"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "vaultzip-gui"
path = "src/main.rs"

[dependencies]
vaultzip-core = { path = "../vaultzip-core" }
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "x11"] }
rfd = { version = "0.14", default-features = false, features = ["gtk3", "common-controls-v6"] }
