name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe what you want to do, not only the feature you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like VaultZip to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other programs or workarounds you use today.
  - type: dropdown
    id: platform
    attributes:
      label: Which platforms matter for this?
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
